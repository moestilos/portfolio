<section class="sec" id="skills">
  <div class="wrap">
    <div class="sec-head" reveal>
      <div>
        <span class="eyebrow">Stack técnico</span>
        <h2 class="h2">Las herramientas <span class="mut">con las que trabajo cada día.</span></h2>
      </div>
      <p>Del frontend a la automatización con IA. El nivel va de una a cinco barras.</p>
    </div>

    <div class="sk-wrap">
      <div class="ind-scroll" reveal>
        <div class="ind" role="tablist" aria-label="Categorías" [style.--n]="filters.length" [style.--i]="activeIndex">
          <span class="ind-pill" aria-hidden="true"></span>
          @for (f of filters; track f.key) {
            <button type="button" role="tab" [attr.aria-selected]="f.key === active" (click)="active = f.key">{{ f.label }}</button>
          }
        </div>
      </div>

      <div class="sk-grid" role="tabpanel">
        @for (sk of current; track active + sk.name; let i = $index) {
          <div class="bn sk" [style.--i]="i">
            <span>{{ sk.name }}</span>
            <span class="lvl" [attr.aria-label]="'Nivel ' + dots(sk.level) + ' de 5'">
              @for (d of [1, 2, 3, 4, 5]; track d) {<i [class.on]="d <= dots(sk.level)"></i>}
            </span>
          </div>
        }
      </div>
    </div>
  </div>
</section>
