<header class="hd" [class.scrolled]="scrolled">
  <div class="wrap hd-in">
    <a class="brand" href="#hero" (click)="navigate($event, '#hero')" aria-label="Guillermo Mateos, inicio">
      <img src="images/guillermo-cara.webp" alt="" width="32" height="32">
      Guillermo Mateos <span>· Full-Stack</span>
    </a>

    <nav class="nav" aria-label="Secciones">
      @for (link of links; track link.href) {
        <a [href]="link.href" [class.on]="isActive(link.href)" (click)="navigate($event, link.href)">{{ link.label }}</a>
      }
    </nav>

    <div class="hd-acts">
      <button class="icon-btn" type="button" (click)="toggleTheme()" [attr.aria-label]="dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        @if (dark) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>
      <a class="btn btn-p btn-sm" href="#contact" (click)="navigate($event, '#contact')">Hablemos</a>
      <button class="icon-btn menu-btn" type="button" (click)="mobileOpen = !mobileOpen" [attr.aria-expanded]="mobileOpen" aria-controls="mnav" aria-label="Menú">
        @if (mobileOpen) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        }
      </button>
    </div>
  </div>

  @if (mobileOpen) {
    <nav class="mnav" id="mnav" aria-label="Secciones">
      @for (link of links; track link.href) {
        <a [href]="link.href" (click)="navigate($event, link.href)">{{ link.label }}</a>
      }
      <a class="btn btn-p" href="#contact" (click)="navigate($event, '#contact')">Hablemos</a>
    </nav>
  }
</header>
