<section class="sec" id="experience">
  <div class="wrap">
    <div class="sec-head" reveal>
      <span class="eyebrow">Trayectoria</span>
      <h2 class="h2">Experiencia <span class="mut">y formación.</span></h2>
    </div>

    <ol class="xp" reveal>
      @for (item of items; track item.title) {
        <li>
          <time>{{ item.date }}</time>
          <div><b>{{ item.title }}</b><span>{{ item.place }}</span></div>
          <span class="badge" [class.work]="item.type === 'work'">{{ item.badge }}</span>
        </li>
      }
    </ol>
  </div>
</section>
