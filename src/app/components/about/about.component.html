<section class="sec" id="skills">
  <div class="wrap">
    <div class="sec-head" reveal>
      <span class="sec-num"><b>03</b> Tecnologías</span>
      <h2 class="h2">Mi stack <span class="mut">técnico.</span></h2>
      <p>Herramientas y frameworks con los que trabajo en proyectos reales.</p>
    </div>

    <div class="stack v3">
      @for (g of stack; track g.group; let i = $index) {
        <div class="stack-g" reveal>
          <span class="no">{{ num(i) }}</span>
          <h3 class="t">{{ g.group }}</h3>
          <p>{{ g.desc }}</p>
          <div class="tags">@for (t of g.items; track t) {<span class="tag">{{ t }}</span>}</div>
        </div>
      }
    </div>
  </div>
</section>
