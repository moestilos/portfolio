<section class="sec" id="contact">
  <div class="wrap">
    <div class="end" reveal>
      <div class="end-dots" aria-hidden="true">@for (d of dots; track $index) {<i></i>}</div>
      <div>
        <h2>¿Tienes un proyecto o una oferta? Hablemos.</h2>
        <p>Te respondo en menos de 24 h. Freelance o por cuenta ajena, en Sevilla o en remoto.</p>
      </div>
      <div class="end-acts">
        <a class="btn btn-p" [href]="'mailto:' + email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          {{ email }}
        </a>
        <a class="btn btn-o" href="https://www.linkedin.com/in/guillermo-mateos-de-los-santos-aguilera-02427b260/" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn btn-o" href="https://github.com/moestilos" target="_blank" rel="noopener">GitHub</a>
        <a class="btn btn-o" href="images/Guillermo Mateos Santos CV.pdf" download>Descargar CV</a>
      </div>
    </div>
  </div>
</section>
