<section class="sec" id="services">
  <div class="wrap">
    <div class="sec-head" reveal>
      <span class="eyebrow">Qué hago</span>
      <h2 class="h2">Tres cosas, <span class="mut">bien hechas.</span></h2>
    </div>

    <div class="sv-grid">
      @for (s of services; track s.title) {
        <article class="sv" reveal>
          <span class="ic" aria-hidden="true">
            @switch (s.icon) {
              @case ('web') {<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg>}
              @case ('auto') {<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 3 3v6.5M15.5 18H9a3 3 0 0 1-3-3V8.5"/></svg>}
              @default {<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>}
            }
          </span>
          <h3>{{ s.title }}</h3>
          <p>{{ s.desc }}</p>
          <div class="tags">@for (t of s.tags; track t) {<span class="tag">{{ t }}</span>}</div>
        </article>
      }
    </div>
  </div>
</section>
