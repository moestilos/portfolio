<section class="hero" id="hero">
  <div class="wrap hero-in">
    <div>
      <span class="hero-badge fx-up" style="--i:0"><span class="live"></span>Disponible · Sevilla y en remoto</span>

      <h1 class="fx-up" style="--i:1">Desarrollador full-stack. <span class="mut">Webs, automatización e IA.</span></h1>

      <p class="hero-lead fx-up" style="--i:2">
        Soy <b>Guillermo Mateos</b>. Construyo productos web completos y automatizo el trabajo que hay detrás,
        del diseño a producción. Fundador de <b>Aguilera Studio</b>.
      </p>

      <div class="hero-cta fx-up" style="--i:3">
        <a class="btn btn-p" href="#projects" (click)="go($event, 'projects')">
          Ver proyectos
          <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a class="btn btn-o" href="#contact" (click)="go($event, 'contact')">Contactar</a>
        <a class="btn btn-g" href="images/Guillermo Mateos Santos CV.pdf" download (click)="trackCv()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
          CV
        </a>
      </div>
    </div>

    <div class="stage fx-pop" style="--i:2" (pointermove)="tilt($event)" (pointerleave)="untilt()">
      <div class="frame" [style.--rx]="rx" [style.--ry]="ry">
        <img src="images/guillermo.webp" alt="Guillermo Mateos" width="720" height="900" fetchpriority="high">
      </div>
      <div class="float">
        <span class="live"></span>
        <span><b>Aguilera Studio</b>aguilerastudio.dev</span>
      </div>
    </div>
  </div>
</section>
