<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>Guillermo Mateos | Desarrollador Full-Stack · Automatización e IA</title>
  <meta name="description" content="Desarrollador web full-stack especializado en automatización, web scraping y desarrollo asistido por IA. Angular, Next.js, Python, n8n. Sevilla — proyectos en remoto para toda España.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="images/guillermo.webp" as="image" type="image/webp">
  <!-- Tema antes de pintar (sin parpadeo): el elegido por el visitante o, si no, el del sistema. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="Guillermo Mateos · Desarrollador Full-Stack">
  <meta property="og:description" content="Creo aplicaciones web modernas y automatizo el trabajo manual que hay detrás. Angular · Next.js · Python · n8n · Integraciones con IA">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/guillermo.jpg">
</head>

</body>
</html>
